name: Build Standoff Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip {} \;
          ls -la

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25b
          add-to-path: true

      - name: Build with ndk-build
        run: |
          # Ищем папку jni, где лежит Android.mk
          if [ -d "jni" ]; then cd jni; fi
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload Library
        uses: actions/upload-artifact@v4
        with:
          name: Built-Library
          path: '**/libs/arm64-v8a/*.so'
